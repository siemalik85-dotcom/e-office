<script type="module">
// ==========================================================
// KONFIGURASI APLIKASI
// ==========================================================
const IS_PREVIEW = false; // Ubah menjadi false SAAT DEPLOY / PUBLISH agar terhubung murni ke Firebase tanpa data dummy

// PASTE FIREBASE CONFIG ANDA DI SINI
const firebaseConfig = {
 apiKey: "AIzaSyCmB2tYSisCYb19Gg4CDiXNeroAg2jwu_Q",
  authDomain: "surat-masuk-130e0.firebaseapp.com",
  projectId: "surat-masuk-130e0",
  storageBucket: "surat-masuk-130e0.firebasestorage.app",
  messagingSenderId: "165216038657",
  appId: "1:165216038657:web:585a2e997df53bfa077500"
};

// ==========================================================
// STATE & UTILITAS
// ==========================================================
const S = { kelas: [], mapel: [], siswa: [], tugas: [], pengumpulan: [], sekolah: { namaSekolah: 'Sekolah Anda', tahunAjaran: '', logoUrl: '' } };
let U = { role: null, user: null };
const V = { page: 'dashboard', q: '', fKelas: '', fMapel: '', fStatus: '', tugasId: '', rekapKelas: '', rekapMapel: '', loginTab: 'siswa' };
const DEMO = { email: 'guru@demo.sch', pw: 'guru123' };

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const byId = (arr, id) => arr.find(x => x.id === id);
const nm = (arr, id, k) => (byId(arr, id) || {})[k] || '—';
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const safeUrl = u => /^https?:\/\//i.test(u || '');
const ic = (n, c = 'w-4 h-4') => `<i data-lucide="${n}" class="${c}"></i>`;
const now = () => new Date();
const fmtD = iso => iso ? new Date(iso).toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
const fmtShort = iso => iso ? new Date(iso).toLocaleDateString('id-ID', { day: '2-digit', month: 'short' }) : '—';
const toLocalInput = iso => { const d = new Date(iso || Date.now() + 864e5); const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };
const sameDay = iso => { if (!iso) return false; const a = new Date(iso), b = now(); return a.toDateString() === b.toDateString(); };
const byNama = (a, b) => (a.nama || '').localeCompare(b.nama || '');
const greet = () => { const h = now().getHours(); return h < 11 ? 'Selamat Pagi' : h < 15 ? 'Selamat Siang' : h < 18 ? 'Selamat Sore' : 'Selamat Malam'; };
const sisa = iso => { const d = new Date(iso) - now(); if (d < 0) { const h = Math.floor(-d / 36e5); return h < 24 ? `Terlewat ${h} jam` : `Terlewat ${Math.floor(h / 24)} hari`; } const h = Math.floor(d / 36e5); return h < 24 ? `${h} jam lagi` : `${Math.floor(h / 24)} hari lagi`; };
const COLORS = ['#34B27B', '#3B82F6', '#F59E0B', '#8B5CF6', '#EC4899'];

// ----- Foto / kamera (disimpan terkompres langsung di dokumen pengumpulan) -----
const MAX_FOTO = 3, MAX_FOTO_CHARS = 330000, MAX_TOTAL_CHARS = 900000;
let PH = [];          // foto yang sedang disiapkan di form pengumpulan (data URL JPEG)
let camStream = null; // stream kamera langsung (desktop)
const okImg = s => typeof s === 'string' && /^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(s);
const fotosOf = p => (p && Array.isArray(p.fotos) ? p.fotos.filter(okImg) : []);
function encodeJpeg(src, w, h) {
  for (const [m, q] of [[1280, 0.72], [1024, 0.6], [800, 0.5], [640, 0.45]]) {
    const s = Math.min(1, m / Math.max(w, h)), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(src, 0, 0, c.width, c.height);
    const out = c.toDataURL('image/jpeg', q);
    if (out.length <= MAX_FOTO_CHARS) return out;
  }
  throw new Error('Foto terlalu besar. Coba foto dengan resolusi lebih kecil.');
}
async function compressFile(file) {
  if (!/^image\//.test(file.type)) throw new Error('File harus berupa gambar.');
  const url = URL.createObjectURL(file);
  try {
    const im = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('Gambar tidak dapat dibaca.')); i.src = url; });
    return encodeJpeg(im, im.naturalWidth, im.naturalHeight);
  } finally { URL.revokeObjectURL(url); }
}
function addPhoto(d) {
  if (PH.length >= MAX_FOTO) throw new Error('Maksimal ' + MAX_FOTO + ' foto.');
  if (PH.reduce((a, s) => a + s.length, 0) + d.length > MAX_TOTAL_CHARS) throw new Error('Total ukuran foto terlalu besar. Hapus satu foto lalu coba lagi.');
  PH.push(d); refreshPH();
}
function photoGrid(list, pid, removable) {
  return list.map((s, i) => `<div class="ph" data-act="zoom" data-pid="${esc(pid)}" data-i="${i}"><img src="${s}" alt="Foto ${i + 1}" loading="lazy">${removable ? `<button type="button" class="x" data-act="photo-del" data-i="${i}" title="Hapus foto">&times;</button>` : ''}</div>`).join('');
}
function refreshPH() {
  const g = $('#phGrid'); if (!g) return;
  g.innerHTML = photoGrid(PH, '_ph', true);
  const c = $('#phCount'); if (c) c.textContent = PH.length + '/' + MAX_FOTO + ' foto';
}
function stopCam() {
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  const lb = $('#lightbox'); if (lb) lb.innerHTML = '';
}
async function openCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { $('#fileCam').click(); return; }
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
    $('#lightbox').innerHTML = `<div class="lb"><video id="camv" autoplay playsinline muted></video><div class="flex gap-2"><button type="button" class="btn btn-p" data-act="cam-snap">${ic('camera', 'w-4 h-4')} Ambil Foto</button><button type="button" class="btn btn-s" data-act="cam-close">Batal</button></div></div>`;
    lucide.createIcons();
    $('#camv').srcObject = camStream;
  } catch (e) {
    camStream = null; stopCam();
    toast('Kamera tidak dapat dibuka (izin ditolak atau bukan https). Pilih gambar dari perangkat.', 'err');
    $('#fileGal').click();
  }
}
const badge = (t, c) => `<span class="badge ${c}">${t}</span>`;
const empty = (m = 'Belum ada data') => `<div class="py-10 text-center text-slate-400 text-sm">${ic('inbox', 'w-8 h-8 mx-auto mb-2 opacity-50')}${m}</div>`;
const sha256 = async t => { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); };
const hashPw = (nis, pw) => sha256('tugas-siswa:' + nis + ':' + pw);
const errMsg = e => {
  const c = (e && e.code) || '';
  if (/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)) return 'Email atau password salah.';
  if (/permission-denied/.test(c)) return 'Akses ditolak oleh Security Rules. Periksa konfigurasi rules Anda.';
  if (c === 'auth/too-many-requests') return 'Terlalu banyak percobaan. Coba lagi nanti.';
  if (c === 'auth/network-request-failed' || c === 'unavailable') return 'Koneksi bermasalah. Periksa internet Anda.';
  if (c === 'auth/requires-recent-login') return 'Sesi sudah lama. Keluar lalu masuk lagi.';
  return (e && e.message) || 'Terjadi kesalahan.';
};
function toast(msg, type) {
  const d = document.createElement('div'); d.className = 'toast ' + (type === 'err' ? 'err' : ''); d.textContent = msg;
  $('#toasts').appendChild(d); setTimeout(() => d.remove(), 3200);
}
function csv(rows, name) {
  const t = rows.map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + t], { type: 'text/csv;charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}

// ==========================================================
// LAPISAN DATA (Preview = memori sementara, Produksi = Firestore)
// ==========================================================
let FB = {}, auth = null, db = null;
async function initFirebase() {
  const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const [a, b, c] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  FB = { ...a, ...b, ...c };
  const app = FB.initializeApp(firebaseConfig);
  auth = FB.getAuth(app); db = FB.getFirestore(app);
}
const changed = () => { if (U.role) renderView(); };
const DB = {
  async add(col, data) {
    if (IS_PREVIEW) { const id = uid(); S[col].push({ id, ...data }); changed(); return id; }
    return (await FB.addDoc(FB.collection(db, col), data)).id;
  },
  async set(col, id, data, merge = false) {
    if (IS_PREVIEW) {
      const i = S[col].findIndex(x => x.id === id);
      if (i < 0) S[col].push({ id, ...data }); else S[col][i] = merge ? { ...S[col][i], ...data } : { id, ...data };
      changed(); return;
    }
    await FB.setDoc(FB.doc(db, col, id), data, { merge });
  },
  async upd(col, id, data) {
    if (IS_PREVIEW) { const o = byId(S[col], id); if (o) Object.assign(o, data); changed(); return; }
    await FB.updateDoc(FB.doc(db, col, id), data);
  },
  async del(col, id) {
    if (IS_PREVIEW) { S[col] = S[col].filter(x => x.id !== id); changed(); return; }
    await FB.deleteDoc(FB.doc(db, col, id));
  },
  async sekolah(data) {
    if (IS_PREVIEW) { S.sekolah = { ...S.sekolah, ...data }; return; }
    await FB.setDoc(FB.doc(db, 'pengaturan', 'sekolah'), data, { merge: true });
  }
};

// Listener real-time (hanya produksi)
let unsubs = [], subUnsubs = {};
function stopAll() { unsubs.forEach(f => { try { f(); } catch (e) {} }); unsubs = []; Object.values(subUnsubs).forEach(f => { try { f(); } catch (e) {} }); subUnsubs = {}; }
function listen(col, q) {
  unsubs.push(FB.onSnapshot(q || FB.collection(db, col), sn => { S[col] = sn.docs.map(d => ({ id: d.id, ...d.data() })); changed(); }, e => { console.error(col, e); toast(errMsg(e), 'err'); }));
}
function listenSekolah() {
  unsubs.push(FB.onSnapshot(FB.doc(db, 'pengaturan', 'sekolah'), d => { if (d.exists()) { S.sekolah = { ...S.sekolah, ...d.data() }; } changed(); }, () => {}));
}
function startAdminListeners() { ['kelas', 'mapel', 'siswa', 'tugas', 'pengumpulan'].forEach(c => listen(c)); listenSekolah(); }
function startStudentListeners() {
  listen('kelas'); listen('mapel'); listenSekolah();

function watchSubs() {
  const want = new Set(S.tugas.map(t => t.id));
  Object.keys(subUnsubs).forEach(k => { if (!want.has(k)) { subUnsubs[k](); delete subUnsubs[k]; S.pengumpulan = S.pengumpulan.filter(p => p.tugasId !== k); } });
  S.tugas.forEach(t => {
    if (subUnsubs[t.id]) return;
    subUnsubs[t.id] = FB.onSnapshot(FB.doc(db, 'pengumpulan', t.id + '_' + U.user.nis), d => {
      S.pengumpulan = S.pengumpulan.filter(p => p.tugasId !== t.id);
      if (d.exists()) S.pengumpulan.push({ id: d.id, ...d.data() });
      changed();
    }, e => console.error(e));
  });
}

const siswaKelas = kid => S.siswa.filter(s => s.kelasId === kid && s.aktif !== false);
const subOf = (tid, sid) => S.pengumpulan.find(p => p.tugasId === tid && p.siswaId === sid);
const myTugas = () => S.tugas.filter(t => t.kelasId === U.user.kelasId).sort((a, b) => a.tenggat.localeCompare(b.tenggat));
const mySub = tid => S.pengumpulan.find(p => p.tugasId === tid && p.siswaId === U.user.nis);
function adminStats() {
  let tepat = 0, terlambat = 0, belum = 0;
  S.tugas.forEach(t => siswaKelas(t.kelasId).forEach(s => { const p = subOf(t.id, s.id); if (!p) belum++; else if (p.status === 'terlambat') terlambat++; else tepat++; }));
  return { tepat, terlambat, belum };
}
function myStats() {
  const ts = myTugas(); let belum = 0, dik = 0, dn = 0, sum = 0;
  ts.forEach(t => { const p = mySub(t.id); if (!p) belum++; else if (p.nilai != null) { dn++; sum += p.nilai / t.nilaiMaks * 100; } else dik++; });
  return { belum, dik, dn, total: ts.length, avg: dn ? Math.round(sum / dn) : 0 };
}
function lastMonths(n) {
  const a = [], d = new Date();
  for (let i = n - 1; i >= 0; i--) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); a.push({ y: x.getFullYear(), m: x.getMonth(), label: x.toLocaleString('id-ID', { month: 'short' }) }); }
  return a;
}

function donut(seg, big, sub) {
  const tot = seg.reduce((a, s) => a + s.val, 0); let off = 25, c = '';
  if (!tot) c = '<circle cx="21" cy="21" r="15.9155" fill="none" stroke="#E5EEE9" stroke-width="5"/>';
  else seg.forEach(s => { const p = s.val / tot * 100; if (p > 0) c += `<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${s.color}" stroke-width="5" stroke-dasharray="${p} ${100 - p}" stroke-dashoffset="${off}"/>`; off -= p; });
  return `<div class="relative w-32 h-32 shrink-0"><svg viewBox="0 0 42 42" class="w-full h-full">${c}</svg><div class="absolute inset-0 flex flex-col items-center justify-center"><div class="text-lg font-extrabold leading-tight">${big}</div><div class="text-[10px] text-slate-400">${sub}</div></div></div>`;
}
const legend = seg => { const tot = seg.reduce((a, s) => a + s.val, 0); return seg.map(s => `<div class="flex items-center gap-2 text-xs"><span class="dot" style="background:${s.color}"></span><span class="flex-1 text-slate-600">${s.label}</span><b>${s.val}</b><span class="text-slate-400 w-9 text-right">${tot ? Math.round(s.val / tot * 100) : 0}%</span></div>`).join(''); };
function barChart(data) {
  const max = Math.max(1, ...data.map(d => d.val)); const hi = data.reduce((m, d, i) => d.val > data[m].val ? i : m, 0);
  return `<div class="bars">${data.map((d, i) => `<div class="bcol"><div class="bar ${i === hi && d.val > 0 ? 'on' : ''}" style="height:${Math.max(3, d.val / max * 100)}%"><span class="tip">${d.val} tugas</span></div><div class="text-[10px] text-slate-400 mt-2">${d.label}</div></div>`).join('')}</div>`;
}
const head = (t, s, actions = '') => `<div class="flex flex-wrap items-center justify-between gap-3 mb-4"><div><h1 class="text-xl font-extrabold">${t}</h1><p class="text-xs text-slate-500">${s}</p></div><div class="flex gap-2 flex-wrap">${actions}</div></div>`;
const tile = (act, data, icon, label, col) => `<button class="tile" data-act="${act}" ${data}><span class="ti ${col}">${ic(icon, 'w-5 h-5')}</span><span>${label}</span></button>`;
const opts = (arr, k, sel, ph) => (ph !== undefined ? `<option value="">${ph}</option>` : '') + arr.map(x => `<option value="${esc(x.id)}" ${x.id === sel ? 'selected' : ''}>${esc(x[k])}</option>`).join('');
const fld = (l, i) => `<div class="mb-3"><label class="lbl">${l}</label>${i}</div>`;
const stBadge = p => !p ? badge('Belum', 'b-s') : p.nilai != null ? badge('Dinilai', 'b-g') : p.status === 'terlambat' ? badge('Terlambat', 'b-a') : badge('Tepat waktu', 'b-b');
function sStatus(t, p) {
  if (p && p.nilai != null) return badge('Dinilai', 'b-g');
  if (p) return p.status === 'terlambat' ? badge('Dikumpulkan (terlambat)', 'b-a') : badge('Dikumpulkan', 'b-b');
  return new Date(t.tenggat) < now() ? badge('Lewat tenggat', 'b-r') : badge('Belum dikerjakan', 'b-a');
}

function rekapData() {
  const ts = S.tugas.filter(t => (!V.rekapKelas || t.kelasId === V.rekapKelas) && (!V.rekapMapel || t.mapelId === V.rekapMapel));
  const siswa = S.siswa.filter(s => !V.rekapKelas || s.kelasId === V.rekapKelas).sort(byNama);
  const perSiswa = siswa.map(s => {
    const rel = ts.filter(t => t.kelasId === s.kelasId); let dik = 0, tl = 0, sum = 0, n = 0;
    rel.forEach(t => { const p = subOf(t.id, s.id); if (p) { dik++; if (p.status === 'terlambat') tl++; if (p.nilai != null) { sum += p.nilai / t.nilaiMaks * 100; n++; } } });
    return { s, tot: rel.length, dik, tl, belum: rel.length - dik, avg: n ? Math.round(sum / n * 10) / 10 : null };
  });
  const perTugas = ts.map(t => {
    const ps = S.pengumpulan.filter(p => p.tugasId === t.id && p.nilai != null);
    return { t, tot: siswaKelas(t.kelasId).length, dik: S.pengumpulan.filter(p => p.tugasId === t.id).length, avg: ps.length ? Math.round(ps.reduce((a, p) => a + p.nilai / t.nilaiMaks * 100, 0) / ps.length * 10) / 10 : null };
  });
  return { perSiswa, perTugas };
}

const forms = {};
forms.login = async f => {
  const id = f.get('id').trim(), pw = f.get('pw');
  if (V.loginTab === 'guru') {
    if (IS_PREVIEW) {
      if (id !== DEMO.email || pw !== DEMO.pw) throw new Error('Email atau password salah.');
      U = { role: 'admin', user: { email: id } }; V.page = 'dashboard'; mountShell();
    } else {
      await FB.signInWithEmailAndPassword(auth, id, pw); // onAuthStateChanged akan memuat dashboard
    }
  } else {
    const h = await hashPw(id, pw); let s;
    if (IS_PREVIEW) s = byId(S.siswa, id);
    else { const d = await FB.getDoc(FB.doc(db, 'siswa', id)); s = d.exists() ? { id: d.id, ...d.data() } : null; }
    if (!s || s.aktif === false || s.passwordHash !== h) throw new Error('NIS atau password salah.');
    U = { role: 'siswa', user: { nis: s.id, nama: s.nama, kelasId: s.kelasId, hash: s.passwordHash } };
    V.page = 'beranda';
    if (!IS_PREVIEW) startStudentListeners();
    mountShell();
  }
};
forms.kelas = async f => {
  const id = f.get('edit'), namaKelas = f.get('namaKelas').trim(), waliKelas = f.get('waliKelas').trim();
  if (!namaKelas) throw new Error('Nama kelas wajib diisi.');
  if (id) await DB.upd('kelas', id, { namaKelas, waliKelas }); else await DB.add('kelas', { namaKelas, waliKelas });
  closeModal(); toast('Kelas disimpan');
};
forms.mapel = async f => {
  const id = f.get('edit'), namaMapel = f.get('namaMapel').trim(), guruPengampu = f.get('guruPengampu').trim();
  if (!namaMapel) throw new Error('Nama mapel wajib diisi.');
  if (id) await DB.upd('mapel', id, { namaMapel, guruPengampu }); else await DB.add('mapel', { namaMapel, guruPengampu });
  closeModal(); toast('Mata pelajaran disimpan');
};
forms.siswa = async f => {
  const edit = f.get('edit'), nis = (edit || f.get('nis')).trim(), nama = f.get('nama').trim(), kelasId = f.get('kelasId'), pw = f.get('pw');
  if (!/^[A-Za-z0-9._-]{3,30}$/.test(nis)) throw new Error('NIS/Username 3–30 karakter (huruf, angka, titik, strip).');
  if (!nama || !kelasId) throw new Error('Nama dan kelas wajib diisi.');
  if (!edit) { if (S.siswa.some(s => s.id === nis)) throw new Error('NIS/Username sudah terdaftar.'); if (pw.length < 6) throw new Error('Password minimal 6 karakter.'); }
  if (pw && pw.length < 6) throw new Error('Password minimal 6 karakter.');
  const data = { nis, nama, kelasId, aktif: f.get('aktif') === '1' };
  if (pw) data.passwordHash = await hashPw(nis, pw);
  await DB.set('siswa', nis, data, true);
  closeModal(); toast('Siswa disimpan');
};
forms.tugas = async f => {
  const id = f.get('edit'), judul = f.get('judul').trim(), mapelId = f.get('mapelId'), kelasId = f.get('kelasId'), tg = f.get('tenggat');
  const nilaiMaks = Number(f.get('nilaiMaks')), lampiran = f.get('lampiran').trim();
  if (!judul || !mapelId || !kelasId || !tg) throw new Error('Judul, mapel, kelas, dan tenggat wajib diisi.');
  if (!(nilaiMaks > 0)) throw new Error('Nilai maksimal harus lebih dari 0.');
  if (lampiran && !safeUrl(lampiran)) throw new Error('Tautan lampiran harus diawali http:// atau https://');
  const data = { judul, instruksi: f.get('instruksi').trim(), mapelId, kelasId, tenggat: new Date(tg).toISOString(), nilaiMaks, lampiranUrl: lampiran };
  if (id) await DB.upd('tugas', id, data); else await DB.add('tugas', { ...data, dibuatPada: new Date().toISOString() });
  closeModal(); toast('Tugas disimpan');
};
forms.nilai = async f => {
  const p = byId(S.pengumpulan, f.get('pid')), t = byId(S.tugas, p.tugasId), n = Number(f.get('nilai'));
  if (!(n >= 0 && n <= t.nilaiMaks)) throw new Error(`Nilai harus antara 0 dan ${t.nilaiMaks}.`);
  await DB.upd('pengumpulan', p.id, { nilai: n, feedback: f.get('feedback').trim(), dinilaiPada: new Date().toISOString() });
  closeModal(); toast('Nilai disimpan');
};
forms.submit = async f => {
  const tid = f.get('tid'), t = byId(S.tugas, tid), old = mySub(tid);
  if (old && old.nilai != null) throw new Error('Tugas sudah dinilai, tidak bisa diubah.');
  const jawaban = f.get('jawaban').trim(), tautan = f.get('tautan').trim();
  const fotos = PH.filter(okImg).slice(0, MAX_FOTO);
  if (!jawaban && !tautan && !fotos.length) throw new Error('Isi jawaban, tautan file, atau lampirkan foto terlebih dahulu.');
  if (tautan && !safeUrl(tautan)) throw new Error('Tautan harus diawali http:// atau https://');
  const waktu = new Date().toISOString(), status = new Date(waktu) <= new Date(t.tenggat) ? 'tepat' : 'terlambat';
  if (old) await DB.upd('pengumpulan', old.id, { jawaban, tautanFile: tautan, fotos, waktuKumpul: waktu, status });
  else await DB.set('pengumpulan', tid + '_' + U.user.nis, { tugasId: tid, siswaId: U.user.nis, namaSiswa: U.user.nama, kelasId: t.kelasId, jawaban, tautanFile: tautan, fotos, waktuKumpul: waktu, status });
  closeModal(); toast(status === 'tepat' ? 'Tugas berhasil dikumpulkan' : 'Tugas dikumpulkan (terlambat)');
};
forms.sekolah = async f => {
  const data = { namaSekolah: f.get('namaSekolah').trim(), tahunAjaran: f.get('tahunAjaran').trim(), logoUrl: f.get('logoUrl').trim() };
  if (!data.namaSekolah) throw new Error('Nama sekolah wajib diisi.');
  if (data.logoUrl && !safeUrl(data.logoUrl)) throw new Error('Tautan logo harus diawali http:// atau https://');
  await DB.sekolah(data); S.sekolah = { ...S.sekolah, ...data };
  mountShell(); toast('Profil sekolah disimpan');
};
forms.pwAdmin = async (f, form) => {
  const lama = f.get('lama'), baru = f.get('baru');
  if (baru.length < 6) throw new Error('Password baru minimal 6 karakter.');
  if (baru !== f.get('baru2')) throw new Error('Konfirmasi password tidak cocok.');
  if (IS_PREVIEW) { if (lama !== DEMO.pw) throw new Error('Password saat ini salah.'); DEMO.pw = baru; }
  else {
    const u = auth.currentUser;
    await FB.reauthenticateWithCredential(u, FB.EmailAuthProvider.credential(u.email, lama));
    await FB.updatePassword(u, baru);
  }
  form.reset(); toast('Password berhasil diganti');
};
forms.pwSiswa = async (f, form) => {
  const lama = f.get('lama'), baru = f.get('baru');
  if (baru.length < 6) throw new Error('Password baru minimal 6 karakter.');
  if (baru !== f.get('baru2')) throw new Error('Konfirmasi password tidak cocok.');
  const oldH = await hashPw(U.user.nis, lama);
  if (oldH !== U.user.hash) throw new Error('Password saat ini salah.');
  const newH = await hashPw(U.user.nis, baru);
  await DB.upd('siswa', U.user.nis, { passwordHash: newH, passwordLama: oldH });
  U.user.hash = newH; form.reset(); toast('Password berhasil diganti');
};

const A = {
  go: d => go(d.p),
  mclose: () => closeModal(),
  yes: async () => { const f = pend; pend = null; closeModal(); if (f) await f(); },
  tab: d => { V.loginTab = d.t; renderLogin(); },
  chip: d => { V.fStatus = d.k; renderView(); },
  promo: () => { if (U.role === 'admin') mTugas(); else go('kumpul'); },
  logout: async () => {
    stopAll();
    if (U.role === 'admin' && !IS_PREVIEW) { await FB.signOut(auth); return; }
    if (!IS_PREVIEW) { S.tugas = []; S.pengumpulan = []; S.kelas = []; S.mapel = []; }
    U = { role: null, user: null }; V.q = ''; V.fKelas = ''; V.fMapel = ''; V.fStatus = ''; renderLogin();
  },
  'new-kelas': () => mKelas(), 'edit-kelas': d => mKelas(d.id),
  'del-kelas': d => {
    if (S.siswa.some(s => s.kelasId === d.id) || S.tugas.some(t => t.kelasId === d.id)) return toast('Kelas masih dipakai oleh siswa atau tugas.', 'err');
    confirmBox('Hapus kelas ini?', async () => { await DB.del('kelas', d.id); toast('Kelas dihapus'); });
  },
  'new-mapel': () => mMapel(), 'edit-mapel': d => mMapel(d.id),
  'del-mapel': d => {
    if (S.tugas.some(t => t.mapelId === d.id)) return toast('Mapel masih dipakai oleh tugas.', 'err');
    confirmBox('Hapus mata pelajaran ini?', async () => { await DB.del('mapel', d.id); toast('Mapel dihapus'); });
  },
  'new-siswa': () => mSiswa(), 'edit-siswa': d => mSiswa(d.id),
  'del-siswa': d => confirmBox('Hapus siswa ini beserta seluruh pengumpulan tugasnya?', async () => {
    for (const p of S.pengumpulan.filter(p => p.siswaId === d.id)) await DB.del('pengumpulan', p.id);
    await DB.del('siswa', d.id); toast('Siswa dihapus');
  }),
  'new-tugas': () => mTugas(), 'edit-tugas': d => mTugas(d.id),
  'del-tugas': d => confirmBox('Hapus tugas ini beserta seluruh pengumpulannya?', async () => {
    for (const p of S.pengumpulan.filter(p => p.tugasId === d.id)) await DB.del('pengumpulan', p.id);
    await DB.del('tugas', d.id); toast('Tugas dihapus');
  }),
  'go-nilai': d => { V.tugasId = d.id; go('nilai'); },
  grade: d => mNilai(d.id),
  detail: d => mDetail(d.id),
  submit: d => mSubmit(d.id),
  zoom: d => {
    const list = d.pid === '_ph' ? PH : fotosOf(byId(S.pengumpulan, d.pid)), s = list[+d.i];
    if (!okImg(s)) return;
    $('#lightbox').innerHTML = `<div class="lb" data-act="zoomclose"><img src="${s}" alt="Foto"><button type="button" class="btn btn-s">Tutup</button></div>`;
  },
  zoomclose: () => { $('#lightbox').innerHTML = ''; },
  'photo-del': d => { PH.splice(+d.i, 1); refreshPH(); },
  'cam-open': () => {
    if (PH.length >= MAX_FOTO) return toast('Maksimal ' + MAX_FOTO + ' foto.', 'err');
    if (window.matchMedia && matchMedia('(pointer:coarse)').matches) $('#fileCam').click(); else openCamera();
  },
  'gal-open': () => { if (PH.length >= MAX_FOTO) return toast('Maksimal ' + MAX_FOTO + ' foto.', 'err'); $('#fileGal').click(); },
  'cam-snap': () => {
    const v = $('#camv'); if (!v || !v.videoWidth) return;
    const d = encodeJpeg(v, v.videoWidth, v.videoHeight); stopCam(); addPhoto(d);
  },
  'cam-close': () => stopCam(),
  'csv-rekap': () => {
    const { perSiswa } = rekapData();
    csv([['NIS', 'Nama', 'Kelas', 'Jumlah Tugas', 'Dikumpulkan', 'Terlambat', 'Belum', 'Rata-rata (0-100)'], ...perSiswa.map(r => [r.s.nis, r.s.nama, nm(S.kelas, r.s.kelasId, 'namaKelas'), r.tot, r.dik, r.tl, r.belum, r.avg ?? ''])], 'rekap-nilai.csv');
  }
};
document.addEventListener('click', async e => {
  const bg = e.target.closest('.mback'); if (bg && e.target === bg) { closeModal(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  try { await fn(el.dataset, el); } catch (err) { toast(errMsg(err), 'err'); }
});
document.addEventListener('submit', async e => {
  const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault();
  const btn = f.querySelector('button[type=submit]'), er = f.querySelector('.ferr');
  if (btn) btn.disabled = true; if (er) er.textContent = '';
  try { await forms[f.dataset.form](new FormData(f), f); } catch (x) { if (er) er.textContent = errMsg(x); else toast(errMsg(x), 'err'); }
  if (btn) btn.disabled = false;
});
document.addEventListener('change', async e => {
  const t = e.target; if (!t || !t.dataset || !t.dataset.photo) return;
  const files = [...t.files]; t.value = '';
  for (const f of files) { try { addPhoto(await compressFile(f)); } catch (x) { toast(errMsg(x), 'err'); break; } }
});
const onF = e => { const t = e.target; if (t && t.dataset && t.dataset.f && V[t.dataset.f] !== t.value) { V[t.dataset.f] = t.value; renderView(); } };
document.addEventListener('input', onF); document.addEventListener('change', onF);
document.addEventListener('keydown', e => { if (e.target && e.target.id === 'gq' && e.key === 'Enter') { V.q = e.target.value; go('tugas', true); } });

// ==========================================================
// PWA: Service Worker dibuat dinamis lewat Blob
// ==========================================================
function registerPWA() {
  try {
    if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
    const code = "const C='tugas-siswa-v1';self.addEventListener('install',()=>self.skipWaiting());self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(x=>x!==C).map(x=>caches.delete(x)))).then(()=>self.clients.claim()))});self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;const u=new URL(e.request.url);if(u.origin!==self.location.origin)return;e.respondWith(fetch(e.request).then(r=>{const c=r.clone();caches.open(C).then(x=>x.put(e.request,c));return r}).catch(()=>caches.match(e.request)))});";
    navigator.serviceWorker.register(URL.createObjectURL(new Blob([code], { type: 'text/javascript' }))).catch(() => {});
  } catch (e) {}
}

// ==========================================================
// BOOT
// ==========================================================
async function boot() {
  registerPWA();
  if (IS_PREVIEW) { await seedPreview(); renderLogin(); return; }
  try {
    await initFirebase();
    try { const d = await FB.getDoc(FB.doc(db, 'pengaturan', 'sekolah')); if (d.exists()) S.sekolah = { ...S.sekolah, ...d.data() }; } catch (e) {}
    FB.onAuthStateChanged(auth, u => {
      if (u) { stopAll(); U = { role: 'admin', user: { email: u.email } }; V.page = 'dashboard'; startAdminListeners(); mountShell(); }
      else if (U.role === 'admin') { stopAll(); S.kelas = []; S.mapel = []; S.siswa = []; S.tugas = []; S.pengumpulan = []; U = { role: null, user: null }; renderLogin(); }
      else if (!U.role) renderLogin();
    });
  } catch (e) {
    $('#root').innerHTML = `<div class="p-6 max-w-md mx-auto"><div class="card"><div class="font-extrabold mb-1">Gagal terhubung ke Firebase</div><p class="text-sm text-slate-600">${esc(errMsg(e))}</p><p class="text-xs text-slate-400 mt-2">Periksa nilai firebaseConfig dan koneksi internet.</p></div></div>`;
  }
}
boot();
</script>
